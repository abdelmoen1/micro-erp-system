; Production PHP settings for the Laravel API image.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The image is immutable: no timestamp checks.
opcache.validate_timestamps = 0
