ServerName localhost
ServerTokens Prod
ServerSignature Off

# The port is rewritten at start-up to Render's PORT (docker/entrypoint.sh).
<VirtualHost *:10000>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # public/.htaccess: front controller and Authorization header pass-through.
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
