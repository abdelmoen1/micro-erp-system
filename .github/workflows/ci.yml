name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend tests (sqlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, pdo_sqlite, pdo_mysql, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test

  backend-mysql:
    name: Backend tests (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hisbah_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hisbah_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, pdo_sqlite, pdo_mysql, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test -c phpunit.mysql.xml

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # no-undef is an error in .oxlintrc.json (regression guard for DEF-12).
      - run: npx oxlint -D no-undef
      - run: npm run build
      # D-32 Playwright proof: login + DEF-13 registration regression against a mocked API.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  mobile:
    name: Mobile analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Unit and widget tests only. The live API scenarios (test/live) are skipped
      # without LIVE_API; the phone run is integration_test/ (US-1306).
      - run: flutter test
      - name: Test release artifact verifiers
        run: bash tool/ci/test_inspect_artifact_signatures.sh

  # The API goes to production only through the private repository abdelmoen1/hisbah-db-backups,
  # which holds the database secrets: back up → migrate → Render deploy hook → check /version.
  # This public repository holds only a token that may start that workflow (docs/deploy/render.md).
  deploy-api:
    name: Deploy API (backup, migrate, deploy)
    needs: [backend-sqlite, backend-mysql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - name: Start the deploy workflow
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret DEPLOY_DISPATCH_TOKEN is not set, so the API was not deployed (docs/deploy/render.md)."
            exit 1
          fi
          gh workflow run deploy-api.yml -R abdelmoen1/hisbah-db-backups -f sha="$SHA"
          echo "Deploy of \`$SHA\` started in abdelmoen1/hisbah-db-backups (private): backup, migrate, deploy." >> "$GITHUB_STEP_SUMMARY"
