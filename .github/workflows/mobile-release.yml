# Full Android release of the Flutter app through Shorebird (the baseline for OTA patches).
# Automatic on a main push that changes the mobile version, and manually from main.
# Needed for the first install and whenever a change cannot ship as a patch.
# Runbook: docs/mobile/ota-updates.md
name: Mobile release (Shorebird, Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Shared with mobile-patch.yml: never publish a release and a patch at the same time.
concurrency:
  group: shorebird-android
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  gate:
    name: Release version changed
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.version.outputs.release_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect a new release version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          elif git diff HEAD^ HEAD -- mobile/pubspec.yaml | grep -q '^[-+]version:'; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Analyze and test
    needs: gate
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release:
    name: Shorebird release (AAB + APK)
    needs: [gate, checks]
    if: always() && github.ref == 'refs/heads/main' && needs.gate.outputs.release_needed == 'true' && needs.checks.result == 'success'
    runs-on: ubuntu-latest
    environment: mobile-production
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: mobile
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
      APK_DISTRIBUTION: ${{ vars.MOBILE_APK_DISTRIBUTION }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Before anything is published: a release without a way to install it would burn its version.
      - name: Preflight
        run: bash tool/ci/preflight.sh release

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0 ndk;28.2.13676358'

      - name: Verify production signing identity
        run: bash tool/ci/verify_signing_key.sh

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Write signing config and production env (runner only, git-ignored)
        run: bash tool/ci/write_build_config.sh

      - name: Shorebird release
        id: release
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: android
          flutter-version: ${{ env.FLUTTER_VERSION }}
          working-directory: mobile
          args: --artifact apk --public-key-path shorebird-patch-public.pem -- --no-tree-shake-icons --dart-define-from-file=env/production.json

      # Future Play upload, signed with the existing upload key. Play App Signing is not enrolled.
      - name: Keep and verify the AAB
        id: aab
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release-version }}
        run: |
          mkdir -p "$RUNNER_TEMP/aab-out"
          aab="$RUNNER_TEMP/aab-out/hisbah-${RELEASE_VERSION//+/_}.aab"
          test -s build/app/outputs/bundle/release/app-release.aab || {
            echo "::error::Shorebird did not produce a non-empty production AAB."
            exit 1
          }
          cp build/app/outputs/bundle/release/app-release.aab "$aab"
          bash tool/ci/inspect_aab.sh "$aab"
          (cd "$RUNNER_TEMP/aab-out" && sha256sum "$(basename "$aab")" > "$(basename "$aab").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: hisbah-android-aab-${{ steps.release.outputs.release-version }}
          path: ${{ runner.temp }}/aab-out/
          retention-days: 30
          if-no-files-found: error

      - name: Inspect APK (application ID, version, signing certificate)
        id: apk
        run: bash tool/ci/inspect_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Package APK for download
        id: package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release-version }}
        run: |
          name="hisbah-${RELEASE_VERSION//+/_}"
          bash tool/ci/package_apk.sh build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/apk-out" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The patch workflow compares pushes with this commit; create its tag only after both artifacts pass verification.
      - name: Tag the release commit
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release-version }}
        run: |
          tag="android-${RELEASE_VERSION//+/_}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      # Keep the release private until every verified asset has uploaded successfully.
      - name: Publish production Android release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.release-version }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          tag="android-${RELEASE_VERSION//+/_}"
          cp "$RUNNER_TEMP/apk-out/$NAME.apk" "$RUNNER_TEMP/apk-out/hisbah.apk"
          (cd "$RUNNER_TEMP/apk-out" && sha256sum hisbah.apk > hisbah.apk.sha256)
          aab="$RUNNER_TEMP/aab-out/hisbah-${RELEASE_VERSION//+/_}.aab"
          gh release create "$tag" --draft --verify-tag \
            --title "Hisbah Android $RELEASE_VERSION" \
            --notes "Production Android release $RELEASE_VERSION. Includes the supplier-return quantity precision fix and latest main fixes. Signed APK and AAB plus SHA-256 checksums. Built from commit $GITHUB_SHA." \
            "$RUNNER_TEMP/apk-out/$NAME.apk" \
            "$RUNNER_TEMP/apk-out/$NAME.apk.sha256" \
            "$RUNNER_TEMP/apk-out/hisbah.apk" \
            "$RUNNER_TEMP/apk-out/hisbah.apk.sha256" \
            "$aab" "$aab.sha256"
          gh release edit "$tag" --draft=false --latest

      - name: Summary
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release-version }}
          APP_ID: ${{ steps.apk.outputs.package }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          CERT_SHA256: ${{ steps.apk.outputs.cert_sha256 }}
          AAB_CERT_SHA256: ${{ steps.aab.outputs.cert_sha256 }}
        run: |
          {
            echo "### Shorebird release published"
            echo "| | |"
            echo "|---|---|"
            echo "| Platform | android (aab + apk) |"
            echo "| Release version | \`$RELEASE_VERSION\` |"
            echo "| Application ID | \`$APP_ID\` (versionCode $VERSION_CODE) |"
            echo "| Signing cert SHA-256 | \`$CERT_SHA256\` |"
            echo "| AAB signing cert SHA-256 | \`$AAB_CERT_SHA256\` |"
            echo "| API base URL | \`$API_BASE_URL\` |"
            echo "| Patch signing | on (shorebird-patch-public.pem) |"
            echo "| Release commit tag | \`android-${RELEASE_VERSION//+/_}\` (patch baseline) |"
            echo "| AAB (future Google Play upload) | public release asset and workflow artifact \`hisbah-android-aab-$RELEASE_VERSION\`, kept 30 days; signed with the existing D4 upload key; not uploaded to Play (no Play App Signing certificate exists yet) |"
            echo "| APK download | public GitHub release \`android-${RELEASE_VERSION//+/_}\` with fixed asset \`hisbah.apk\` and checksum |"
            echo
            echo "After installing and checking this build on the phone: set MOBILE_OTA_RELEASE_VERSION=$RELEASE_VERSION, then MOBILE_OTA_ENABLED=true."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks env/production.json
